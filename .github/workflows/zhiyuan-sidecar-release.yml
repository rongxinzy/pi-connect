name: Release ZhiYuan sidecar

on:
  push:
    tags:
      - 'zhiyuan-sidecar-v*'

permissions:
  contents: read

concurrency:
  group: zhiyuan-sidecar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          go test ./cmd/zhiyuan-sidecar
          bash tools/verify-zhiyuan-sidecar-boundary.sh

      - name: Build platform binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/zhiyuan-sidecar
          build() {
            local goos="$1"
            local goarch="$2"
            local output="$3"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' \
                -o "dist/zhiyuan-sidecar/$output" ./cmd/zhiyuan-sidecar
          }
          build windows amd64 cc-connect-sidecar-windows-amd64.exe
          build darwin amd64 cc-connect-sidecar-darwin-amd64
          build darwin arm64 cc-connect-sidecar-darwin-arm64
          build linux amd64 cc-connect-sidecar-linux-amd64

      - uses: actions/upload-artifact@v6
        with:
          name: unsigned-sidecar-binaries
          path: dist/zhiyuan-sidecar/cc-connect-sidecar-*
          if-no-files-found: error
          retention-days: 1

  sign-windows:
    needs: build
    runs-on: windows-latest
    environment: release
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-sidecar-binaries
          path: dist/zhiyuan-sidecar
      - name: Connect Certum SimplySign
        id: certum
        uses: ./.github/actions/setup-certum-signing
        with:
          user-id: ${{ secrets.CERTUM_USER_ID }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certificate-thumbprint: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      - name: Sign and verify Windows sidecar before checksums
        shell: pwsh
        env:
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum.outputs.thumbprint }}
        run: >-
          ./tools/windows-signing/sign-runtime.ps1
          -Path dist/zhiyuan-sidecar/cc-connect-sidecar-windows-amd64.exe
      - uses: actions/upload-artifact@v6
        with:
          name: signed-windows-sidecar
          path: dist/zhiyuan-sidecar/cc-connect-sidecar-windows-amd64.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-sidecar-binaries
          path: dist/zhiyuan-sidecar
      - uses: actions/download-artifact@v8
        with:
          name: signed-windows-sidecar
          path: dist/zhiyuan-sidecar
      - name: Generate immutable release metadata
        shell: bash
        run: |
          set -euo pipefail
          cd dist/zhiyuan-sidecar
          chmod +x cc-connect-sidecar-darwin-* cc-connect-sidecar-linux-*
          sha256sum cc-connect-sidecar-* > checksums.txt
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg revision "$GITHUB_SHA" \
            --rawfile checksums checksums.txt \
            '{
              schemaVersion: 1,
              sourceRepository: "https://github.com/rongxinzy/pi-connect",
              tag: $tag,
              sourceRevision: $revision,
              sha256: (
                $checksums
                | split("\n")
                | map(select(length > 0) | split("  "))
                | map({key: .[1], value: .[0]})
                | from_entries
              )
            }' > runtime-manifest.json

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/zhiyuan-sidecar/* \
            --verify-tag \
            --title "ZhiYuan sidecar ${GITHUB_REF_NAME#zhiyuan-sidecar-}" \
            --generate-notes
